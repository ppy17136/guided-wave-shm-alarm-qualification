project: envwave_ssl_pilot
seed: 20260809

data:
  root: data/zarr
  paths: 8
  samples_per_wave: 2000
  months: [2018_03, 2021_04]
  train_period: [2018_03_01, 2018_03_31]
  validation_period: [2021_04_01, 2021_04_16]
  test_period: [2021_04_17, 2021_04_30]
  healthy_tag: 0
  normalize_from_train_only: true
  note: pilot-only-large-time-gap-not-paper-protocol

model:
  name: envwave_ssl
  embedding_dim: 192
  transformer_layers: 4
  attention_heads: 6
  mask_ratio: 0.35
  environment_dim: 6
  dropout: 0.1

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  workers: 16
  mixed_precision: true
  gradient_clip: 1.0
  early_stopping_patience: 10

evaluation:
  target_false_alarms_per_month: [1, 5, 10]
  bootstrap_samples: 500
  confidence_level: 0.95
  calibration: conformal_block
  block_hours: 24
